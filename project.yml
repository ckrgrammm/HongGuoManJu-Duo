name: ManjuDuo
options:
  bundleIdPrefix: me.rrmm
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    DEVELOPMENT_TEAM: ''
targets:
  ManjuDuo:
    type: application
    platform: iOS
    sources:
      - path: ManjuDuo
        excludes: [Vendor]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.rrmm.manjuduo
        PRODUCT_NAME: ManjuDuo
        INFOPLIST_KEY_CFBundleDisplayName: 漫剧 Duo
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: libz.tbd
  ManjuDuoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies: [{target: ManjuDuo}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: me.rrmm.manjuduo.uitests
        TEST_TARGET_NAME: ManjuDuo
schemes:
  ManjuDuo:
    build:
      targets:
        ManjuDuo: all
        ManjuDuoUITests: [test]
    test:
      targets: [ManjuDuoUITests]
